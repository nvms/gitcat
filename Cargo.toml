[package]
name = "gitcat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.5", features = ["derive", "env"] }
gix = { version = "=0.86.0", default-features = false, features = ["max-performance-safe", "sha1", "blob-diff", "revision", "blame"] }
maud = { version = "0.27.0", features = ["axum"] }
percent-encoding = "2.3.2"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.4"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
